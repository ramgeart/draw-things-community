name: Release Linux x64

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release'
        required: true
        default: 'v1.0.0'

jobs:
  build-linux-x64:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Pre-setup steps to download Bazel before firewall restrictions
      - name: Pre-download Bazel
        run: |
          # Download Bazel binary directly before firewall restrictions
          mkdir -p $HOME/.cache/bazel
          BAZEL_VERSION="6.4.0"
          curl -L -o $HOME/.cache/bazel/bazel-${BAZEL_VERSION}-linux-x86_64 \
            https://github.com/bazelbuild/bazel/releases/download/${BAZEL_VERSION}/bazel-${BAZEL_VERSION}-linux-x86_64
          chmod +x $HOME/.cache/bazel/bazel-${BAZEL_VERSION}-linux-x86_64
          # Set up environment
          echo "USE_BAZEL_VERSION=${BAZEL_VERSION}" >> $GITHUB_ENV
          echo "BAZELISK_HOME=$HOME/.cache/bazel" >> $GITHUB_ENV

      - name: Setup Bazel
        run: |
          # Use the pre-downloaded Bazel binary
          sudo cp $HOME/.cache/bazel/bazel-${USE_BAZEL_VERSION}-linux-x86_64 /usr/local/bin/bazel-binary
          sudo chmod +x /usr/local/bin/bazel-binary
          # Test Bazel installation
          /usr/local/bin/bazel-binary version

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            llvm-dev \
            libc6-dev \
            libatlas3-base \
            libblas3 \
            libjpeg8-dev \
            libpng-dev \
            curl \
            tar

      - name: Install Swift
        run: |
          # Install Swift 6.0.3 for Ubuntu 22.04
          curl -O https://download.swift.org/swift-6.0.3-release/ubuntu2204/swift-6.0.3-RELEASE/swift-6.0.3-RELEASE-ubuntu22.04.tar.gz
          tar xzf swift-6.0.3-RELEASE-ubuntu22.04.tar.gz
          sudo mv swift-6.0.3-RELEASE-ubuntu22.04 /usr/local/swift
          echo "/usr/local/swift/usr/bin" >> $GITHUB_PATH
          echo "LD_LIBRARY_PATH=/usr/local/swift/usr/lib/swift/linux:${LD_LIBRARY_PATH}" >> $GITHUB_ENV

      - name: Setup repository for Linux
        run: |
          # Verify Swift installation
          swift --version
          
          # Setup for Linux without requiring specific LLVM installation path
          echo "try-import %workspace%/.bazelrc.linux" > .bazelrc
          ln -sf WORKSPACE.linux WORKSPACE
          
          # Setup git hooks
          mkdir -p .git/hooks/pre-commit.d
          rm -f .git/hooks/pre-commit
          ln -s $(pwd)/Scripts/vendors/dispatch .git/hooks/pre-commit || true
          rm -f .git/hooks/pre-commit.d/swift-format
          ln -s $(pwd)/Scripts/swift-format/pre-commit .git/hooks/pre-commit.d/swift-format || true
          rm -f .git/hooks/pre-commit.d/buildifier
          ln -s $(pwd)/Scripts/buildifier/pre-commit .git/hooks/pre-commit.d/buildifier || true
          
          # Configure Bazel for offline/minimal network usage
          echo "build --repository_cache=$HOME/.cache/bazel-repo" >> .bazelrc.local
          echo "build --disk_cache=$HOME/.cache/bazel-disk" >> .bazelrc.local
          mkdir -p $HOME/.cache/bazel-repo $HOME/.cache/bazel-disk

      - name: Build Linux binaries
        timeout-minutes: 60
        run: |
          # Set up Bazel with better error handling and networking resilience
          export BAZEL_BIN="/usr/local/bin/bazel-binary"
          
          # Verify Bazel is working
          echo "Testing Bazel installation..."
          $BAZEL_BIN version
          
          # Query available targets first
          echo "Querying available targets..."
          $BAZEL_BIN query //Apps:* || echo "Query failed, continuing with known targets"
          
          # Build all the main binaries for Linux with verbose output
          echo "Building ModelConverter..."
          $BAZEL_BIN build --config=release //Apps:ModelConverter --verbose_failures --show_progress_rate_limit=5
          
          echo "Building LoRAConverter..."
          $BAZEL_BIN build --config=release //Apps:LoRAConverter --verbose_failures --show_progress_rate_limit=5
          
          echo "Building EmbeddingConverter..."
          $BAZEL_BIN build --config=release //Apps:EmbeddingConverter --verbose_failures --show_progress_rate_limit=5
          
          echo "Building ModelQuantizer..."
          $BAZEL_BIN build --config=release //Apps:ModelQuantizer --verbose_failures --show_progress_rate_limit=5
          
          echo "Building gRPCServerCLI..."
          $BAZEL_BIN build --config=release //Apps:gRPCServerCLI --verbose_failures --show_progress_rate_limit=5
          
          # Verify binaries were built
          echo "Verifying built binaries..."
          ls -la bazel-bin/Apps/ || echo "Bazel-bin directory not found"
          
          # Test that binaries are executable (with error handling)
          for binary in ModelConverter LoRAConverter EmbeddingConverter ModelQuantizer gRPCServerCLI; do
            if [ -f "bazel-bin/Apps/$binary" ]; then
              echo "Found $binary:"
              file "bazel-bin/Apps/$binary"
              ls -la "bazel-bin/Apps/$binary"
            else
              echo "Warning: $binary not found in expected location"
            fi
          done

      - name: Package Linux binaries
        run: |
          mkdir -p dist/linux-x64
          
          # Copy binaries to dist directory with error checking
          echo "Copying binaries..."
          for binary in ModelConverter LoRAConverter EmbeddingConverter ModelQuantizer gRPCServerCLI; do
            if [ -f "bazel-bin/Apps/$binary" ]; then
              echo "Copying $binary..."
              cp "bazel-bin/Apps/$binary" "dist/linux-x64/"
            else
              echo "Error: $binary not found for packaging"
              exit 1
            fi
          done
          
          # Make sure all binaries are executable
          chmod +x dist/linux-x64/*
          
          # Verify files and show sizes
          echo "Packaged binaries:"
          ls -lah dist/linux-x64/
          
          # Verify all expected files are present
          for binary in ModelConverter LoRAConverter EmbeddingConverter ModelQuantizer gRPCServerCLI; do
            if [ ! -f "dist/linux-x64/$binary" ]; then
              echo "Error: $binary missing from dist directory"
              exit 1
            fi
          done
          
          # Create archive
          cd dist
          tar -czf draw-things-linux-x64.tar.gz linux-x64/
          
          # Show archive info
          echo "Archive created:"
          ls -lah draw-things-linux-x64.tar.gz
          
          # Verify archive contents
          echo "Archive contents:"
          tar -tzf draw-things-linux-x64.tar.gz

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: draw-things-linux-x64
          path: dist/draw-things-linux-x64.tar.gz
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: dist/draw-things-linux-x64.tar.gz
          name: Release ${{ github.ref_name }}
          body: |
            Draw Things Community Release ${{ github.ref_name }}
            
            ## Linux x64 Binaries
            
            This archive contains the following binaries built for Linux x64:
            
            - **ModelConverter** - Convert models between different formats
            - **LoRAConverter** - Convert LoRA models  
            - **EmbeddingConverter** - Convert embedding models
            - **ModelQuantizer** - Quantize models for better performance
            - **gRPCServerCLI** - gRPC server for Draw Things
            
            ## Usage
            
            Extract the archive and run the binaries:
            ```bash
            tar -xzf draw-things-linux-x64.tar.gz
            cd linux-x64
            ./gRPCServerCLI /path/to/models
            ```
            
            ## Requirements
            
            - Linux x64 system
            - Libraries: libatlas3-base, libblas3, libjpeg8, libpng16
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}