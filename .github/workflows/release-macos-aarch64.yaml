name: Release macOS aarch64

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release'
        required: true
        default: 'v1.0.0'

jobs:
  build-macos-aarch64:
    runs-on: macos-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.8.5
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
        timeout-minutes: 15

      - name: Install dependencies
        run: |
          # Install coreutils for realpath command
          brew install coreutils

      - name: Setup repository for macOS
        run: |
          ./Scripts/install.sh

      - name: Build macOS binaries
        timeout-minutes: 60
        run: |
          # Build all the main binaries for macOS with verbose output
          echo "Building ModelConverter..."
          bazel build --config=release //Apps:ModelConverter --verbose_failures
          
          echo "Building LoRAConverter..."
          bazel build --config=release //Apps:LoRAConverter --verbose_failures
          
          echo "Building EmbeddingConverter..."
          bazel build --config=release //Apps:EmbeddingConverter --verbose_failures
          
          echo "Building ModelQuantizer..."
          bazel build --config=release //Apps:ModelQuantizer --verbose_failures
          
          echo "Building gRPCServerCLI-macOS..."
          bazel build --config=release //Apps:gRPCServerCLI-macOS --verbose_failures
          
          # Verify binaries were built
          echo "Verifying built binaries..."
          ls -la bazel-bin/Apps/
          
          # Check the macOS app bundle structure
          echo "Checking gRPCServerCLI-macOS app bundle..."
          find bazel-bin/Apps/gRPCServerCLI-macOS.app -type f | head -10

      - name: Package macOS binaries
        run: |
          mkdir -p dist/macos-aarch64
          
          # Copy binaries to dist directory
          echo "Copying binaries..."
          cp bazel-bin/Apps/ModelConverter dist/macos-aarch64/
          cp bazel-bin/Apps/LoRAConverter dist/macos-aarch64/
          cp bazel-bin/Apps/EmbeddingConverter dist/macos-aarch64/
          cp bazel-bin/Apps/ModelQuantizer dist/macos-aarch64/
          
          # For macOS, extract the binary from the .app bundle
          if [ -f "bazel-bin/Apps/gRPCServerCLI-macOS.app/Contents/MacOS/gRPCServerCLI-macOS" ]; then
            cp bazel-bin/Apps/gRPCServerCLI-macOS.app/Contents/MacOS/gRPCServerCLI-macOS dist/macos-aarch64/gRPCServerCLI-macOS
          else
            echo "Warning: gRPCServerCLI-macOS not found in expected location"
            find bazel-bin/Apps/gRPCServerCLI-macOS.app -name "*gRPCServerCLI*" -type f
            # Try to find and copy it anyway
            find bazel-bin/Apps/gRPCServerCLI-macOS.app -name "*gRPCServerCLI*" -type f -exec cp {} dist/macos-aarch64/gRPCServerCLI-macOS \;
          fi
          
          # Make sure all binaries are executable
          chmod +x dist/macos-aarch64/*
          
          # Verify files and show sizes
          echo "Packaged binaries:"
          ls -lah dist/macos-aarch64/
          
          # Create archive
          cd dist
          tar -czf draw-things-macos-aarch64.tar.gz macos-aarch64/
          
          # Show archive info
          echo "Archive created:"
          ls -lah draw-things-macos-aarch64.tar.gz

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: draw-things-macos-aarch64
          path: dist/draw-things-macos-aarch64.tar.gz
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: dist/draw-things-macos-aarch64.tar.gz
          name: Release ${{ github.ref_name }}
          body: |
            Draw Things Community Release ${{ github.ref_name }}
            
            ## macOS aarch64 (Apple Silicon) Binaries
            
            This archive contains the following binaries built for macOS Apple Silicon:
            
            - **ModelConverter** - Convert models between different formats
            - **LoRAConverter** - Convert LoRA models  
            - **EmbeddingConverter** - Convert embedding models
            - **ModelQuantizer** - Quantize models for better performance
            - **gRPCServerCLI-macOS** - gRPC server for Draw Things (macOS optimized)
            
            ## Usage
            
            Extract the archive and run the binaries:
            ```bash
            tar -xzf draw-things-macos-aarch64.tar.gz
            cd macos-aarch64
            ./gRPCServerCLI-macOS /path/to/models
            ```
            
            ## Requirements
            
            - macOS 13.0 or later
            - Apple Silicon (M1/M2/M3) processor
            
            **Security Note:** On first run, macOS may show a security warning. Go to System Preferences > Privacy & Security to allow the applications to run.
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}